# cargo-deny configuration (ADR-0017), checked by `cargo deny check` as part of `cargo xtask verify`, on every pull request and every night.
# It covers RustSec advisories, the license allowlist, banned and duplicate crates, and the allowed sources. The rules Cargo and cargo-deny cannot check (exact pins and the 24-hour minimum age of new package versions) are `cargo xtask check-exact-pins` and `cargo xtask check-lockfile-age` (work package X-003).

[graph]
# Check the dependencies of every feature, so nothing escapes the check by hiding behind an optional feature.
all-features = true

[advisories]
# Every RustSec advisory (vulnerable, unsound or unmaintained crate) fails the check, and so does a yanked version. An exception needs the advisory ID in `ignore`, with a comment explaining why we are not affected.
yanked = "deny"
# Advisories that a crate is unmaintained or unsound count for every crate in the build, direct or not. For unmaintained crates that is cargo-deny's default; for unsound ones the default would count only the workspace's direct dependencies.
unmaintained = "all"
unsound = "all"
# Exceptions added by the CORE-004 spike for crates that Loro (ADR-0008) pulls in, accepted by the owner on 2026-10-08 (ADR-0008, amendment 2026-10-08; spikes/crdt-model/REPORT.md §10, question 4). None of these crates has a fixed version: im, sized-chunks and bitmaps were archived on 2026-05-03, and atomic-polyfill in 2023. Four advisories say a crate is unmaintained; two say it is unsound (undefined behaviour reachable from safe code), and their reasons explain why Loro does not reach the affected code. Every monthly dependency session re-checks them (the docs repository's developer/dependency-update-runbook.md): each reason must still hold, and each is removed as soon as Loro no longer needs its crate (Loro is asked to move to the maintained replacements, imbl and imbl-sized-chunks).
ignore = [
  { id = "RUSTSEC-2026-0248", reason = "im 15.1.0 is unmaintained; its maintained fork is imbl. Outside its tests Loro uses only im::HashMap<PeerID, Counter> (loro-internal src/version.rs, ImVersionVector); the unsound OrdSet is RUSTSEC-2023-0126 below." },
  { id = "RUSTSEC-2023-0126", reason = "im 15.1.0 is unsound when inserting into an OrdSet (an aliasing violation in sized_chunks::Chunk::force_copy). No Loro crate uses OrdSet at all (loro-internal 1.17.1 has none, tests and features included); the im::HashMap it uses is built on SparseChunk, not Chunk." },
  { id = "RUSTSEC-2026-0251", reason = "sized-chunks 0.6.5 is unmaintained; its maintained fork is imbl-sized-chunks. Used only by im (see RUSTSEC-2026-0248); its unsound Chunk is RUSTSEC-2026-0255 below." },
  { id = "RUSTSEC-2026-0255", reason = "sized-chunks 0.6.5: Chunk, RingBuffer and InlineArray free an element twice when the element's Drop panics. Loro reaches sized-chunks only through im::HashMap<PeerID, Counter>, which uses SparseChunk (not affected) and stores integers, whose Drop cannot panic; RingBuffer is not even compiled (its feature is off)." },
  { id = "RUSTSEC-2026-0247", reason = "bitmaps 2.1.0 is unmaintained. Used only by im and sized-chunks (see above); it has no other advisory." },
  { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill (unmaintained since 2023): heapless 0.7, which postcard uses inside Loro, depends on it only for avr, riscv32, thumbv6m and xtensa microcontroller targets, so it is never compiled for any BayanDocs platform (`cargo tree -i atomic-polyfill --target <triple>` is empty for Linux, macOS, Windows and wasm32); cargo-deny lists it because it checks every target." },
  # The nine exceptions below were added by the security-alert session SEC-HEAPLESS on 2026-11-19 and merged only with the owner's acceptance. On 2026-11-18 RustSec published nine unsound advisories for heapless, each fixed only in heapless 0.9.4. Loro's generic-btree moved from heapless 0.9.3 to 0.9.4, but Loro also brings two older copies that no release fixes: heapless 0.7.17, used only by postcard 1.1.3 (postcard's newest release) and switched on by postcard's default features, which serde_columnar 0.3.14 keeps (loro-internal asks for postcard without them); and heapless 0.8.0, used only by loro-delta 1.13.0 (loro-delta 1.18.0 still needs 0.8). No other crate here depends on heapless 0.7 or 0.8, and moving to Loro 1.18.0 would remove none of the nine. postcard uses heapless only for compile-time size constants and for a Vec<u8, N> output (to_vec, to_vec_cobs, to_vec_crc32 and the HVec flavor) that no crate here asks for; loro-delta uses it only for the heapless::Vec inside its ArrayVec, which Loro fills only with its ValueOrHandler. Each reason gives the facts for its advisory and when the exception goes.
  { id = "RUSTSEC-2026-0574", reason = "heapless before 0.9.4: FindMutView::pop (FindMut::pop in heapless 0.7.17 and 0.8.0) can use memory after freeing it once the value was changed. Neither postcard 1.1.3 nor loro-delta 1.13.0, the only users of those two versions here, uses sorted_linked_list. It goes when Loro's dependencies move to heapless 0.9.4 or later, or at the latest at the next monthly dependency session's re-check." },
  { id = "RUSTSEC-2026-0575", reason = "heapless before 0.9.4: Spsc::peek (Queue::peek and Consumer::peek of spsc in heapless 0.7.17 and 0.8.0) reads with Relaxed instead of Acquire ordering, a data race between threads. Neither postcard 1.1.3 nor loro-delta 1.13.0 uses spsc. It goes when Loro's dependencies move to heapless 0.9.4 or later, or at the latest at the next monthly dependency session's re-check." },
  { id = "RUSTSEC-2026-0576", reason = "heapless before 0.9.4: IndexMap::truncate leaves the map's indices inconsistent. heapless 0.7.17 and 0.8.0 have no IndexMap::truncate, and neither postcard 1.1.3 nor loro-delta 1.13.0 uses IndexMap. It goes when Loro's dependencies move to heapless 0.9.4 or later, or at the latest at the next monthly dependency session's re-check." },
  { id = "RUSTSEC-2026-0577", reason = "heapless before 0.9.4: if an element's Drop panics, Deque::clear, HistoryBuffer::clear and write, IndexMap::clear, retain and truncate and the drop of vec::IntoIter drop elements twice. Neither postcard 1.1.3 nor loro-delta 1.13.0 uses Deque, HistoryBuffer or IndexMap. postcard creates no IntoIter, and its Vec holds u8, whose drop cannot panic. loro-delta creates one only in ArrayVec::into_iter, which no crate here calls; the only element type here is Loro's ValueOrHandler, whose drop runs Loro's own Drop code, so it is not shown panic-free. It goes when Loro's dependencies move to heapless 0.9.4 or later, or at the latest at the next monthly dependency session's re-check." },
  { id = "RUSTSEC-2026-0578", reason = "heapless before 0.9.4: the Zeroize implementation of SortedLinkedList leaves the list inconsistent. heapless 0.7.17 and 0.8.0 have no Zeroize support, and neither postcard 1.1.3 nor loro-delta 1.13.0 uses sorted_linked_list. It goes when Loro's dependencies move to heapless 0.9.4 or later, or at the latest at the next monthly dependency session's re-check." },
  { id = "RUSTSEC-2026-0579", reason = "heapless 0.9.2 and 0.9.3 by the advisory's own function list: Deque::try_from an array as long as the deque's capacity breaks the deque. heapless 0.7.17 and 0.8.0 have no TryFrom for Deque (cargo-deny reports them because the advisory's version range covers every version before 0.9.4), and neither postcard 1.1.3 nor loro-delta 1.13.0 uses Deque. It goes when Loro's dependencies move to heapless 0.9.4 or later, or at the latest at the next monthly dependency session's re-check." },
  { id = "RUSTSEC-2026-0580", reason = "heapless before 0.9.4: the Treiber stack behind the memory pools (pool before 0.8; arc_pool, box_pool and object_pool after) races between threads. Neither postcard 1.1.3 nor loro-delta 1.13.0 creates a pool, and heapless 0.8.0 compiles its pools only for 32-bit x86 and ARM targets, none of which BayanDocs builds. It goes when Loro's dependencies move to heapless 0.9.4 or later, or at the latest at the next monthly dependency session's re-check." },
  { id = "RUSTSEC-2026-0581", reason = "heapless before 0.9.4: Deque::make_contiguous can break the deque's invariants and write out of bounds. heapless 0.7.17 and 0.8.0 have no make_contiguous, and neither postcard 1.1.3 nor loro-delta 1.13.0 uses Deque. It goes when Loro's dependencies move to heapless 0.9.4 or later, or at the latest at the next monthly dependency session's re-check." },
  { id = "RUSTSEC-2026-0582", reason = "heapless before 0.9.4: IndexMap::insert can break the map's invariant when the map holds u16::MAX elements. Neither postcard 1.1.3 nor loro-delta 1.13.0 uses IndexMap or IndexSet; the serde support of heapless 0.7.17, which postcard switches on, inserts into them only for code that deserializes into them, and no crate here does. It goes when Loro's dependencies move to heapless 0.9.4 or later, or at the latest at the next monthly dependency session's re-check." },
]

[licenses]
# The license allowlist of ADR-0017 §8. A dual-licensed crate qualifies if one of its options is on the list. Anything else needs an ADR amendment.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
# The allowlist is policy, not a list of what we happen to use today, so an entry no dependency uses yet is not reported.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are unpublished (`publish = false`) and licensed under the repository license, not a third-party license, so the allowlist does not apply to them.
ignore = true

[bans]
# Two versions of the same crate are reported (they cost size and review effort) but do not fail the check.
multiple-versions = "warn"
# Version requirements must be exact (ADR-0017); a `*` requirement fails. Path dependencies between our own unpublished crates need no version.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Dependencies come only from crates.io. A Git dependency needs its repository listed in `allow-git`, with a reason, and must name a fixed `tag` or `rev` (a commit), never a branch; `cargo xtask check-exact-pins` checks the same in the manifests. Cargo.lock records the exact commit either way. `cargo xtask check-lockfile-age`, which runs before anything is built, refuses a Git dependency until a work package teaches it to judge the commit's age.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
required-git-spec = "tag"
