# cargo-deny configuration (ADR-0017), checked by `cargo deny check` as part of `cargo xtask verify`, on every pull request and every night.
# It covers RustSec advisories, the license allowlist, banned and duplicate crates, and the allowed sources. The rules Cargo and cargo-deny cannot check (exact pins and the 24-hour minimum age of new package versions) are `cargo xtask check-exact-pins` and `cargo xtask check-lockfile-age` (work package X-003).

[graph]
# Check the dependencies of every feature, so nothing escapes the check by hiding behind an optional feature.
all-features = true

[advisories]
# Every RustSec advisory (vulnerable, unsound or unmaintained crate) fails the check, and so does a yanked version. An exception needs the advisory ID in `ignore`, with a comment explaining why we are not affected.
yanked = "deny"
# Advisories that a crate is unmaintained or unsound count for every crate in the build, direct or not. For unmaintained crates that is cargo-deny's default; for unsound ones the default would count only the workspace's direct dependencies.
unmaintained = "all"
unsound = "all"
# Exceptions added by the CORE-004 spike for crates that Loro 1.16.2 (ADR-0008) pulls in, accepted pending the owner's review (spikes/crdt-model/REPORT.md §10, question 4). None of these crates has a fixed version: im, sized-chunks and bitmaps were archived on 2026-05-03, and atomic-polyfill in 2023. Four advisories say a crate is unmaintained; two say it is unsound (undefined behaviour reachable from safe code), and their reasons explain why Loro does not reach the affected code. Review them in every dependency session and remove each as soon as nothing depends on its crate.
ignore = [
  { id = "RUSTSEC-2026-0248", reason = "im 15.1.0 is unmaintained; its maintained fork is imbl. Outside its tests Loro uses only im::HashMap<PeerID, Counter> (loro-internal src/version.rs, ImVersionVector); the unsound OrdSet is RUSTSEC-2023-0126 below." },
  { id = "RUSTSEC-2023-0126", reason = "im 15.1.0 is unsound when inserting into an OrdSet (an aliasing violation in sized_chunks::Chunk::force_copy). Loro uses OrdSet nowhere except in code behind its test_utils feature, which this build does not enable; the im::HashMap it uses is built on SparseChunk, not Chunk." },
  { id = "RUSTSEC-2026-0251", reason = "sized-chunks 0.6.5 is unmaintained; its maintained fork is imbl-sized-chunks. Used only by im (see RUSTSEC-2026-0248); its unsound Chunk is RUSTSEC-2026-0255 below." },
  { id = "RUSTSEC-2026-0255", reason = "sized-chunks 0.6.5: Chunk, RingBuffer and InlineArray free an element twice when the element's Drop panics. Loro reaches sized-chunks only through im::HashMap<PeerID, Counter>, which uses SparseChunk (not affected) and stores integers, whose Drop cannot panic; RingBuffer is not even compiled (its feature is off)." },
  { id = "RUSTSEC-2026-0247", reason = "bitmaps 2.1.0 is unmaintained. Used only by im and sized-chunks (see above); it has no other advisory." },
  { id = "RUSTSEC-2023-0089", reason = "atomic-polyfill (unmaintained since 2023): heapless 0.7, which postcard uses inside Loro, depends on it only for avr, riscv32, thumbv6m and xtensa microcontroller targets, so it is never compiled for any BayanDocs platform (`cargo tree -i atomic-polyfill --target <triple>` is empty for Linux, macOS, Windows and wasm32); cargo-deny lists it because it checks every target." },
]

[licenses]
# The license allowlist of ADR-0017 §8. A dual-licensed crate qualifies if one of its options is on the list. Anything else needs an ADR amendment.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
# The allowlist is policy, not a list of what we happen to use today, so an entry no dependency uses yet is not reported.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are unpublished (`publish = false`) and licensed under the repository license, not a third-party license, so the allowlist does not apply to them.
ignore = true

[bans]
# Two versions of the same crate are reported (they cost size and review effort) but do not fail the check.
multiple-versions = "warn"
# Version requirements must be exact (ADR-0017); a `*` requirement fails. Path dependencies between our own unpublished crates need no version.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Dependencies come only from crates.io. A Git dependency needs its repository listed in `allow-git`, with a reason, and must name a fixed `tag` or `rev` (a commit), never a branch; `cargo xtask check-exact-pins` checks the same in the manifests. Cargo.lock records the exact commit either way. `cargo xtask check-lockfile-age`, which runs before anything is built, refuses a Git dependency until a work package teaches it to judge the commit's age.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
required-git-spec = "tag"
