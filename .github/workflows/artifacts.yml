# Builds the engine's artifacts for the shells and runs the test drivers against them (work package CORE-007):
# - the C SDK for Linux x86-64, Windows x86-64 and macOS arm64, each tested by the C driver, linked statically and dynamically;
# - the WebAssembly package, tested by the Node.js driver on all three operating systems;
# - bayan-ffi's unit tests under Miri;
# - a check that every C and Node.js run rendered the same tile, byte for byte (ADR-0004, ADR-0005).
# The SDKs and the WebAssembly package are uploaded as workflow artifacts with a SHA-256 checksum of every file (SHA256SUMS inside the
# artifact) and of the artifact itself (in the job summary). There are no releases yet.
# Workflow rules (ADR-0017), as in verify.yml: actions pinned to full commit SHAs with the version in a comment, minimal permissions, no
# credentials kept after checkout, a timeout on every job, and tools downloaded at pinned versions and checked against SHA-256 checksums.
# Unlike verify.yml, nothing here uses a cache: the artifacts are distributed, so they are built from a fresh checkout and fresh downloads,
# each checked by Cargo or against a pinned checksum, and never from files a cache restored (which nothing checks again).
name: artifacts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    # Explicitly bash on every system, which also sets pipefail: a failing program before a pipe fails its step.
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation helps only when one machine rebuilds again and again, which these jobs never do.
  CARGO_INCREMENTAL: 0
  # Node.js for the Node.js driver: the version of bayan-web's .nvmrc and of the BayanDocs cloud environment, released 2026-09-07. The
  # checksums in the Node.js step come from nodejs.org's SHASUMS256.txt for this version, whose signature by a key of the Node.js release
  # team (nodejs/release-keys) was checked on 2026-10-07; npmmirror's copy agrees. Change them only in the monthly dependency session.
  NODE_VERSION: 24.21.0
  # wasm-bindgen's command-line tool, which turns the engine's module into the package (released 2026-09-25). Must equal the wasm-bindgen
  # crate in Cargo.lock and WASM_BINDGEN_VERSION in scripts/dev-setup.sh, and the checksum in the WebAssembly job must equal that script's
  # (an xtask test checks all three). Change them only in the monthly dependency session.
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  sdk:
    name: C SDK and C driver (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup set auto-self-update disable
          rustup toolchain install
          rustc --version

      # Before the MSVC developer environment: without it, rustc finds Microsoft's linker by itself, as in verify.yml.
      - name: Build the C SDK
        run: cargo xtask sdk --target "$TARGET"

      - name: Set up the MSVC developer environment (x64), for the C driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Equivalent of the "x64 Native Tools Command Prompt": run vcvars64.bat and keep the environment it sets.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installation = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installation) { throw 'No Visual Studio installation with the C++ x64 tools was found.' }
          $vcvars = Join-Path $installation 'VC\Auxiliary\Build\vcvars64.bat'
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
          }

      - name: Run the C driver, linked statically and dynamically
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # Git Bash puts its own `link` (a coreutils program) before Microsoft's linker on PATH, and inside the developer
            # environment rustc takes the first link.exe on PATH. The compiler's folder holds Microsoft's linker, so put it first.
            PATH="$(dirname "$(command -v cl)"):$PATH"
          fi
          cargo xtask c-driver | tee "$RUNNER_TEMP/c-driver.txt"
          mkdir -p "$RUNNER_TEMP/tile"
          tiles=$(grep -o 'tile fnv1a64:[0-9a-f]\{16\}' "$RUNNER_TEMP/c-driver.txt" | sort -u)
          if [ "$(printf '%s\n' "$tiles" | wc -l)" -ne 1 ]; then
            echo "::error::the C driver runs rendered different tiles: $tiles"
            exit 1
          fi
          printf 'C driver, %s: %s\n' "$TARGET" "${tiles#tile }" > "$RUNNER_TEMP/tile/c-$TARGET.txt"

      - name: Write the checksums
        run: scripts/ci-checksums.sh "target/artifacts/bayan-core-sdk-$TARGET"

      - name: Upload the C SDK
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bayan-core-sdk-${{ matrix.target }}
          path: target/artifacts/bayan-core-sdk-${{ matrix.target }}
          if-no-files-found: error

      - name: Upload the tile digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tile-c-${{ matrix.target }}
          path: ${{ runner.temp }}/tile
          if-no-files-found: error
          retention-days: 1

      - name: Summary
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: scripts/ci-checksums.sh --summary "bayan-core-sdk-$TARGET" "$DIGEST" "target/artifacts/bayan-core-sdk-$TARGET" >> "$GITHUB_STEP_SUMMARY"

  wasm:
    name: WebAssembly package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup set auto-self-update disable
          rustup toolchain install
          rustc --version

      - name: Install wasm-bindgen (pinned release archive, SHA-256 checked)
        run: |
          # The project's release archive for Linux x86-64; the checksum matches the .sha256sum file published with it.
          name="wasm-bindgen-$WASM_BINDGEN_VERSION-x86_64-unknown-linux-musl"
          sha256=82d12bb940e2d4e72e0d5605387fc1b8ca179044e012b620f0ce4e7440e8320e
          cd "$RUNNER_TEMP" || exit 1
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$name.tar.gz" \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$WASM_BINDGEN_VERSION/$name.tar.gz"
          actual=$(sha256sum "$name.tar.gz")
          actual=${actual%% *}
          if [ "$actual" != "$sha256" ]; then
            echo "::error::wasm-bindgen checksum mismatch: expected $sha256, got $actual"
            exit 1
          fi
          tar -xzf "$name.tar.gz" "$name/wasm-bindgen"
          # Install next to cargo (rustup's bin directory), which is already on PATH.
          cp "$name/wasm-bindgen" "$(dirname "$(command -v cargo)")/"
          wasm-bindgen --version

      - name: Build the WebAssembly package
        run: cargo xtask wasm-package

      - name: Write the checksums
        run: scripts/ci-checksums.sh target/artifacts/bayan-core-wasm

      - name: Upload the WebAssembly package
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bayan-core-wasm
          path: target/artifacts/bayan-core-wasm
          if-no-files-found: error

      - name: Summary
        env:
          DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: scripts/ci-checksums.sh --summary bayan-core-wasm "$DIGEST" target/artifacts/bayan-core-wasm >> "$GITHUB_STEP_SUMMARY"

  node-driver:
    name: Node.js driver (${{ matrix.os }})
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OS: ${{ matrix.os }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js (pinned version, SHA-256 checked)
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) archive=node-v$NODE_VERSION-linux-x64.tar.xz sha256=fd8e59d5a511510f6a298afb548f18c7d2b1be404d8b4a27d94fbe49f56cb2d6 ;;
            macOS-ARM64) archive=node-v$NODE_VERSION-darwin-arm64.tar.xz sha256=6239d4cf92d864487ec8cd3615038f7b67e7f58b77b21cd2f09ea9fbd68065fe ;;
            Windows-X64) archive=node-v$NODE_VERSION-win-x64.zip sha256=158f7685b44de51f6c0df1d153526cbcd3e1bc739a8dfc607721cef75de9e541 ;;
            *) echo "::error::No pinned Node.js build for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          cd "$RUNNER_TEMP" || exit 1
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 3 --output "$archive" \
            "https://nodejs.org/dist/v$NODE_VERSION/$archive"
          if command -v sha256sum > /dev/null; then actual=$(sha256sum "$archive"); else actual=$(shasum -a 256 "$archive"); fi
          actual=${actual%% *}
          if [ "$actual" != "$sha256" ]; then
            echo "::error::Node.js checksum mismatch: expected $sha256, got $actual"
            exit 1
          fi
          case "$archive" in
            *.zip)
              if command -v unzip > /dev/null; then unzip -q "$archive"; else 7z x -y "$archive" > /dev/null; fi
              node="$PWD/${archive%.zip}/node.exe"
              ;;
            *)
              tar -xJf "$archive"
              node="$PWD/${archive%.tar.xz}/bin/node"
              ;;
          esac
          "$node" --version
          echo "NODE=$node" >> "$GITHUB_ENV"

      - name: Download the WebAssembly package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bayan-core-wasm
          path: wasm-package

      - name: Check the package's checksums
        run: scripts/ci-checksums.sh --check wasm-package

      - name: Run the Node.js driver
        run: |
          status=0
          "$NODE" crates/bayan-wasm/js/tests/node-driver.mjs wasm-package 2> "$RUNNER_TEMP/node-driver.err" \
            | tee "$RUNNER_TEMP/node-driver.txt" || status=$?
          cat "$RUNNER_TEMP/node-driver.err" >&2
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          # The driver makes the engine panic on purpose; neither the engine nor the worker host may print anything, because a
          # message could quote document content (spec §3.1, §3.2). So anything on standard error fails the run.
          if [ -s "$RUNNER_TEMP/node-driver.err" ]; then
            echo "::error::the Node.js driver wrote to standard error"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/tile"
          tile=$(grep -o '^tile fnv1a64:[0-9a-f]\{16\}' "$RUNNER_TEMP/node-driver.txt")
          printf 'Node.js driver, %s: %s\n' "$OS" "${tile#tile }" > "$RUNNER_TEMP/tile/node-$OS.txt"

      - name: Upload the tile digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tile-node-${{ matrix.os }}
          path: ${{ runner.temp }}/tile
          if-no-files-found: error
          retention-days: 1

  same-tile:
    name: Same tile everywhere
    needs: [sdk, node-driver]
    # Runs even when a driver job failed or was skipped, and then fails itself: a skipped check would count as passing.
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that every driver job passed
        env:
          SDK_RESULT: ${{ needs.sdk.result }}
          NODE_DRIVER_RESULT: ${{ needs.node-driver.result }}
        run: |
          if [ "$SDK_RESULT" != success ] || [ "$NODE_DRIVER_RESULT" != success ]; then
            echo "::error::every driver job must pass: the C SDK jobs ended with '$SDK_RESULT', the Node.js driver jobs with '$NODE_DRIVER_RESULT'"
            exit 1
          fi

      - name: Download the tile digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tile-*
          path: tiles
          merge-multiple: true

      - name: Compare them
        run: |
          {
            echo "### The same tile, rendered by every driver"
            echo
            sed 's/^/- /' tiles/*.txt
          } >> "$GITHUB_STEP_SUMMARY"
          cat tiles/*.txt
          # Every line must be a driver's digest, one from each of the six runs, and all six must be the same.
          digests=$(cat tiles/*.txt)
          lines=$(printf '%s\n' "$digests" | wc -l)
          matching=$(printf '%s\n' "$digests" | grep -c -E '^(C|Node\.js) driver, [^:]+: fnv1a64:[0-9a-f]{16}$' || true)
          if [ "$lines" -ne 6 ] || [ "$matching" -ne 6 ]; then
            echo "::error::expected 6 tile digests (3 C, 3 Node.js), found $matching in $lines lines"
            exit 1
          fi
          if [ "$(printf '%s\n' "$digests" | sed 's/.*: //' | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::the drivers rendered different tiles"
            exit 1
          fi

  miri:
    name: Miri (bayan-ffi)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in rust-toolchain.toml
        run: |
          rustup set auto-self-update disable
          rustup toolchain install
          rustc --version

      - name: Install Miri on the pinned nightly toolchain (scripts/dev-setup.sh)
        run: scripts/dev-setup.sh --no-wasm-bindgen

      - name: Run bayan-ffi's unit tests under Miri
        run: cargo xtask miri
