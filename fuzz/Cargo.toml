# The fuzz targets of bayan-core (see README.md). A Cargo workspace of its own, excluded from the main one, because cargo-fuzz builds with the nightly toolchain and its sanitizer flags, and because its dependencies (libfuzzer-sys, which compiles LLVM's libFuzzer from C++) are for fuzzing only and are never linked into, or shipped with, BayanDocs (ADR-0017, amendment of 2026-10-08).

[package]
name = "bayan-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later WITH AdditionRef-BayanDocs-App-Store-Permission"
publish = false

[package.metadata]
cargo-fuzz = true

# The harness of the engine's and the CRDT's targets (CORE-010), which those targets share and this crate's tests check without a fuzzing engine: `cargo +nightly-2026-10-02 test --manifest-path fuzz/Cargo.toml --lib` (README.md).
[lib]
name = "bayan_fuzz"
path = "src/lib.rs"
doc = false

[dependencies]
# The fuzzing engine: LLVM's libFuzzer, which the crate compiles from C++ with its build script, and the `fuzz_target!` macro. Published 2026-06-04; (MIT OR Apache-2.0) AND NCSA, accepted for fuzzing dependencies only (ADR-0017, amendment of 2026-10-08).
libfuzzer-sys = "=0.4.13"
bayan-opc = { path = "../crates/bayan-opc" }
bayan-xml = { path = "../crates/bayan-xml" }
bayan-lab-layout = { path = "../lab/bayan-lab-layout" }
bayan-lab-compare = { path = "../lab/bayan-lab-compare" }
bayan-engine = { path = "../crates/bayan-engine" }
bayan-crdt = { path = "../crates/bayan-crdt" }
# The engine's answers, read as JSON to check them against the protocol's schema; and the messages and recordings that the engine's harness reads before the engine, to count the pixels they ask for, with serde's derived readers and serde_json's `RawValue`, as the engine reads them (src/engine.rs). The versions and features of the main workspace, which bayan-engine uses too (serde published 2026-07-18, serde_json 2026-07-20; both MIT OR Apache-2.0).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }

[[bin]]
name = "zip_archive"
path = "fuzz_targets/zip_archive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "package"
path = "fuzz_targets/package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content_types"
path = "fuzz_targets/content_types.rs"
test = false
doc = false
bench = false

[[bin]]
