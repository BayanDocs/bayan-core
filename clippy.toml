# Hash maps and sets with Rust's default hasher visit their items in a random order that changes from run to run (ADR-0005 §5). Use BTreeMap or BTreeSet. Where iteration order cannot affect any output, allow one use with `#[expect(clippy::disallowed_types, reason = "…")]` explaining why; this is the only determinism ban with an exception.
disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order is random; use BTreeMap, or #[expect(clippy::disallowed_types, reason = \"...\")] where order cannot affect output (ADR-0005 §5)" },
  { path = "std::collections::HashSet", reason = "iteration order is random; use BTreeSet, or #[expect(clippy::disallowed_types, reason = \"...\")] where order cannot affect output (ADR-0005 §5)" },
]

# Tests may unwrap and print; the `unwrap_used`, `print_stdout` and `print_stderr` lints (Cargo.toml) apply to everything else.
allow-unwrap-in-tests = true
allow-print-in-tests = true
