# Clippy configuration for every crate in the workspace (ADR-0005, ADR-0006 §6). `cargo xtask verify` proves that each entry below still triggers (Clippy silently ignores a misspelled method name).
# This must stay the only Clippy configuration file in the repository. Clippy does not merge configuration files: for each crate it reads only the nearest clippy.toml or .clippy.toml above the crate's folder, so a file below the root would replace this one, bans included, for every crate beneath it. `cargo xtask verify` rejects such files and the CLIPPY_CONF_DIR environment variable; put every setting here.

# Floating-point methods whose result is not exactly specified. ADR-0005 §4 allows floating point only in rendering, and only as exact IEEE-754 basic operations, so these methods are forbidden in every crate with no exceptions: never write #[expect(clippy::disallowed_methods, …)].
# - Platform math (sin, exp, powf and the like) calls each platform's own math library, whose results differ between Windows, macOS, Linux and WebAssembly. Use the deterministic functions in bayan-units.
# - The algebraic_* methods let the compiler reorder the operation, fuse a multiply and an add, or replace a division by a reciprocal, so results depend on the platform and the optimization level. Use the plain + - * / % operators.
# - min, max and clamp may return +0.0 or -0.0 non-deterministically when the inputs compare equal (Rust's documentation says so). Compare explicitly instead.
# The other stable float methods of Rust 1.99 (arithmetic, sqrt, mul_add, rounding, sign, comparisons and bit conversions) give the same bits on every platform and stay allowed. When Rust stabilizes another method whose result is not exactly specified (for example gamma, erf or exp10), add it here in the monthly dependency session and call it in xtask/lint-canary.
disallowed-methods = [
  { path = "f32::sin", reason = "platform math differs between platforms; use the deterministic functions in bayan-units (ADR-0005 §4)" },
  { path = "f32::cos", reason = "platform math differs between platforms; use the deterministic functions in bayan-units (ADR-0005 §4)" },
